name: build

# master 푸시/PR: Windows 빌드 + 테스트 (결과물은 Actions 아티팩트)
# v* 태그 푸시: 위에 더해 GitHub Release 생성 -> 앱 자동 업데이트가 이걸 받음
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Version
        id: ver
        shell: bash
        run: |
          base=$(sed -n 's/^project(PoeTradeSearch VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=ON" >> "$GITHUB_OUTPUT"
          else
            echo "version=${base}-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "release=OFF" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DPTS_VERSION=${{ steps.ver.outputs.version }}
          -DPTS_RELEASE_BUILD=${{ steps.ver.outputs.release }}
          -DPTS_UPDATE_REPO=${{ github.repository }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $out = "dist/PoeTradeSearch"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/PoeTradeSearch.exe $out/
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-compiler-runtime "$out/PoeTradeSearch.exe"
          # VC++ 런타임 DLL 같이 넣음 (재배포 패키지 안 깔린 PC 대비)
          $crt = Get-ChildItem -Path "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if ($crt) { Copy-Item "$($crt.FullName)\*.dll" $out/ }
          Copy-Item LICENSE, README.md $out/
          Compress-Archive -Path "$out/*" -DestinationPath PoeTradeSearch-win64.zip -Force
          $hash = (Get-FileHash PoeTradeSearch-win64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  PoeTradeSearch-win64.zip" | Out-File -Encoding ascii PoeTradeSearch-win64.zip.sha256
          Get-Content PoeTradeSearch-win64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PoeTradeSearch-win64-${{ steps.ver.outputs.version }}
          path: |
            PoeTradeSearch-win64.zip
            PoeTradeSearch-win64.zip.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PoeTradeSearch-win64.zip
            PoeTradeSearch-win64.zip.sha256
          generate_release_notes: true
